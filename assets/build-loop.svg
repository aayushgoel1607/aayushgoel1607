<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aayush's build loop</title><desc id="desc">A midnight product studio showing how Aayush moves from questions and models to systems and useful experiences.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500"><stop stop-color="#071019"/><stop offset=".55" stop-color="#0B1720"/><stop offset="1" stop-color="#07151A"/></linearGradient><linearGradient id="line" x1="100" y1="250" x2="1100" y2="250"><stop stop-color="#F28482"/><stop offset=".42" stop-color="#F6BD60"/><stop offset="1" stop-color="#84DCC6"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#B8C4CE" fill-opacity=".08"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/><rect width="1200" height="500" rx="28" fill="url(#dots)"/>
  <path d="M104 292C238 292 242 196 384 196S526 328 670 328S812 178 956 178H1094" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 14"><animate attributeName="stroke-dashoffset" values="52;0" dur="2.8s" repeatCount="indefinite"/></path>
  <circle cx="104" cy="292" r="7" fill="#F28482"><animate attributeName="cx" values="104;384;670;956;1094" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="292;196;328;178;178" dur="5s" repeatCount="indefinite"/></circle>
  <path d="M84 378H1116" stroke="#27404B" stroke-width="1"/><path d="M84 404H1116" stroke="#1A303A" stroke-width="1"/>
  <rect x="300" y="78" width="600" height="112" rx="26" fill="#0E2029" stroke="#F6BD60" stroke-opacity=".65"/>
  <rect x="326" y="100" width="112" height="24" rx="12" fill="#F6BD60" fill-opacity=".13"/><circle cx="344" cy="112" r="4" fill="#F6BD60"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
  <g font-family="Inter, ui-sans-serif, system-ui"><text x="54" y="58" fill="#F6BD60" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3">THE BUILD LOOP</text><text x="1146" y="58" text-anchor="end" fill="#81919D" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">AAYUSH / PRODUCT ENGINEERING</text><text x="600" y="124" text-anchor="middle" fill="#F6BD60" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">CURRENT MODE</text><text x="600" y="166" text-anchor="middle" fill="#F7FAFC" font-size="28" font-weight="800" textLength="520" lengthAdjust="spacingAndGlyphs">MAKE COMPLEX THINGS FEEL CLEAR</text>
    <g><rect x="84" y="236" width="240" height="118" rx="20" fill="#16202A" stroke="#F28482" stroke-opacity=".5"/><text x="108" y="270" fill="#F6A6A4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">01 / QUESTION</text><text x="108" y="306" fill="#FFF" font-size="20" font-weight="700">Find the real need</text><text x="108" y="330" fill="#9CADB8" font-size="12">people · evidence · limits</text></g>
    <g><rect x="348" y="236" width="240" height="118" rx="20" fill="#18221F" stroke="#F6BD60" stroke-opacity=".5"/><text x="372" y="270" fill="#F6BD60" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">02 / MODEL</text><text x="372" y="306" fill="#FFF" font-size="20" font-weight="700">Shape the system</text><text x="372" y="330" fill="#9CADB8" font-size="12">flows · contracts · data</text></g>
    <g><rect x="612" y="236" width="240" height="118" rx="20" fill="#10212B" stroke="#4EA8DE" stroke-opacity=".55"/><text x="636" y="270" fill="#7CC3EA" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">03 / BUILD</text><text x="636" y="306" fill="#FFF" font-size="20" font-weight="700">Engineer the depth</text><text x="636" y="330" fill="#9CADB8" font-size="12">security · tests · failure</text></g>
    <g><rect x="876" y="236" width="240" height="118" rx="20" fill="#10241F" stroke="#84DCC6" stroke-opacity=".55"/><text x="900" y="270" fill="#84DCC6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">04 / SHIP + LEARN</text><text x="900" y="306" fill="#FFF" font-size="20" font-weight="700">Make it useful</text><text x="900" y="330" fill="#9CADB8" font-size="12">experience · feedback · iteration</text></g>
    <text x="72" y="430" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">LEARNING PRODUCTS</text><text x="294" y="430" fill="#F6BD60" font-size="16">•</text><text x="330" y="430" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">AGENT PLATFORMS</text><text x="550" y="430" fill="#4EA8DE" font-size="16">•</text><text x="586" y="430" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">EXPLAINABLE AI</text><text x="790" y="430" fill="#84DCC6" font-size="16">•</text><text x="826" y="430" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">THOUGHTFUL UX</text></g>
  <rect x="1" y="1" width="1198" height="498" rx="27" stroke="#284653" stroke-width="2"/>
