<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aayush Goel — full-stack product engineer</title>
  <desc id="desc">Animated dark-space banner introducing Aayush's work across learning platforms, agent systems, explainable AI, and product experience.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1160" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B18"/><stop offset="0.48" stop-color="#10112A"/><stop offset="1" stop-color="#061823"/>
    </linearGradient>
    <linearGradient id="accent" x1="210" y1="95" x2="720" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"><animate attributeName="stop-color" values="#A78BFA;#22D3EE;#F472B6;#A78BFA" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#F472B6;#A78BFA;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#7C3AED" stop-opacity=".5"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#94A3B8" stroke-opacity=".055"/></pattern>
    <clipPath id="clip"><rect width="1200" height="420" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1015" cy="168" r="260" fill="url(#glow)" filter="url(#blur)"><animate attributeName="r" values="220;285;220" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="390" r="180" fill="#0891B2" opacity=".14" filter="url(#blur)"/>
    <g opacity=".8">
      <circle cx="1007" cy="196" r="112" stroke="#A78BFA" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="8 11"><animateTransform attributeName="transform" type="rotate" from="0 1007 196" to="360 1007 196" dur="24s" repeatCount="indefinite"/></circle>
      <ellipse cx="1007" cy="196" rx="175" ry="64" transform="rotate(-18 1007 196)" stroke="#22D3EE" stroke-opacity=".38" stroke-width="1.4" stroke-dasharray="6 10"><animateTransform attributeName="transform" type="rotate" values="-18 1007 196;342 1007 196" dur="18s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="1007" cy="196" rx="158" ry="48" transform="rotate(56 1007 196)" stroke="#F472B6" stroke-opacity=".3" stroke-width="1.2" stroke-dasharray="4 9"><animateTransform attributeName="transform" type="rotate" values="56 1007 196;-304 1007 196" dur="22s" repeatCount="indefinite"/></ellipse>
      <circle cx="1007" cy="196" r="62" fill="#0B1020" stroke="url(#accent)" stroke-width="3"/>
      <path d="M979 180L1007 160L1035 180V212L1007 232L979 212V180Z" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
      <circle cx="1007" cy="196" r="10" fill="#22D3EE"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="1114" cy="162" r="6" fill="#F472B6"><animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="886" cy="246" r="5" fill="#22D3EE"><animate attributeName="r" values="7;3;7" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect x="65" y="58" width="216" height="31" rx="15.5" fill="#15182E" stroke="#8B5CF6" stroke-opacity=".5"/>
      <circle cx="86" cy="73.5" r="4.5" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="101" y="79" fill="#CBD5E1" font-size="13" letter-spacing="1.8">AVAILABLE TO BUILD</text>
      <text x="65" y="153" fill="#94A3B8" font-size="18" letter-spacing="5">HELLO, WORLD — I'M</text>
      <text x="61" y="226" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui" font-weight="800" font-size="68" letter-spacing="-2">AAYUSH GOEL</text>
      <text x="65" y="270" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui" font-size="22">I build connected systems that stay clear, useful, and human.</text>
      <text x="65" y="318" fill="#22D3EE" font-size="16">$ building</text>
      <text x="174" y="318" fill="#CBD5E1" font-size="16">learning platforms · agent systems · explainable AI</text>
      <rect x="65" y="344" width="520" height="2" rx="1" fill="#1E293B"/>
      <rect x="65" y="344" width="155" height="2" rx="1" fill="url(#accent)"><animate attributeName="width" values="90;520;90" dur="6s" repeatCount="indefinite"/></rect>
      <text x="65" y="382" fill="#64748B" font-size="12" letter-spacing="2">SCROLL TO ENTER THE LAB ↓</text>
    </g>
    <g fill="#FFFFFF">
      <circle cx="760" cy="68" r="1.3"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="330" r="1"><animate attributeName="opacity" values="1;.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="355" r="1.5"><animate attributeName="opacity" values=".1;.8;.1" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>
</svg>
