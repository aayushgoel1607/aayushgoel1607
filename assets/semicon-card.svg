<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Semicon image restoration</title><desc id="desc">Animated 2x semiconductor image-restoration pipeline using a residual U-Net.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330"><stop stop-color="#071622"/><stop offset=".5" stop-color="#071019"/><stop offset="1" stop-color="#15132A"/></linearGradient><linearGradient id="a" x1="80" y1="60" x2="1120" y2="270"><stop stop-color="#84DCC6"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#F6BD60"/></linearGradient><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#FFF" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="330" rx="24" fill="url(#bg)"/><rect width="1200" height="330" rx="24" fill="url(#g)"/><g font-family="Inter, ui-sans-serif, system-ui"><text x="50" y="52" fill="#FFF" font-size="30" font-weight="800">SEMICON / KLA</text><text x="50" y="78" fill="#A8E6D5" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">AI-BASED RESTORATION OF DEGRADED IMAGES</text><text x="1150" y="52" text-anchor="end" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">HACKATHON / COMPUTER VISION</text></g><g stroke="url(#a)" fill="none" stroke-width="2" stroke-dasharray="8 11"><path d="M300 166H470"><animate attributeName="stroke-dashoffset" values="38;0" dur="1.8s" repeatCount="indefinite"/></path><path d="M730 166H900"><animate attributeName="stroke-dashoffset" values="38;0" dur="1.8s" repeatCount="indefinite"/></path></g><g font-family="Inter, ui-sans-serif, system-ui" text-anchor="middle"><g><rect x="90" y="112" width="210" height="108" rx="18" fill="#0A202C" stroke="#84DCC6" stroke-opacity=".6"/><text x="195" y="147" fill="#A8E6D5" font-size="11" letter-spacing="2">DEGRADED INPUT</text><text x="195" y="182" fill="#FFF" font-size="22" font-weight="750">128 × 128</text><text x="195" y="204" fill="#94A3B8" font-size="11">raw grayscale NPY</text></g><g><rect x="470" y="100" width="260" height="132" rx="22" fill="#12192A" stroke="url(#a)" stroke-width="2.5"/><text x="600" y="139" fill="#F9D7A0" font-size="11" letter-spacing="2">RESTORE</text><text x="600" y="174" fill="#FFF" font-size="24" font-weight="750">RESIDUAL U-NET</text><text x="600" y="199" fill="#94A3B8" font-size="11">skip paths · pixel shuffle · 2× head</text></g><g><rect x="900" y="112" width="210" height="108" rx="18" fill="#15142A" stroke="#F6BD60" stroke-opacity=".6"/><text x="1005" y="147" fill="#F9D7A0" font-size="11" letter-spacing="2">RESTORED OUTPUT</text><text x="1005" y="182" fill="#FFF" font-size="22" font-weight="750">256 × 256</text><text x="1005" y="204" fill="#94A3B8" font-size="11">27.7583 dB PSNR</text></g><text x="600" y="282" fill="#64748B" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">FROZEN CHECKPOINT · DETERMINISTIC SPLIT · FAILURE ANALYSIS · STANDALONE INFERENCE</text></g><circle cx="300" cy="166" r="5" fill="#84DCC6"><animate attributeName="cx" values="300;470;730;900" dur="3.2s" repeatCount="indefinite"/></circle><rect x="1" y="1" width="1198" height="328" rx="23" stroke="url(#a)" stroke-opacity=".32" stroke-width="2"/>
</svg>
