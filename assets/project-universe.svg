<svg width="1200" height="650" viewBox="0 0 1200 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aayush build atlas</title><desc id="desc">An asymmetric product roadmap showing five projects as connected build lanes.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="650"><stop stop-color="#071019"/><stop offset=".52" stop-color="#0B1720"/><stop offset="1" stop-color="#07151A"/></linearGradient><linearGradient id="route" x1="120" y1="120" x2="1080" y2="560"><stop stop-color="#F28482"/><stop offset=".45" stop-color="#F6BD60"/><stop offset="1" stop-color="#84DCC6"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#B8C4CE" fill-opacity=".07"/></pattern></defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/><rect width="1200" height="650" rx="28" fill="url(#dots)"/>
  <path d="M112 182H392C450 182 438 304 508 304H692C762 304 750 182 808 182H1088M214 462H464C522 462 520 392 600 392S678 462 736 462H986" stroke="url(#route)" stroke-width="3" stroke-dasharray="11 14"><animate attributeName="stroke-dashoffset" values="50;0" dur="3s" repeatCount="indefinite"/></path>
  <g font-family="Inter, ui-sans-serif, system-ui"><text x="54" y="58" fill="#F6BD60" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3">BUILD ATLAS / FIVE PRODUCTS</text><text x="1146" y="58" text-anchor="end" fill="#81919D" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">OWN WORK + TEAM SYSTEMS</text>
    <g><rect x="72" y="112" width="320" height="140" rx="22" fill="#172126" stroke="#F6BD60" stroke-opacity=".65"/><rect x="94" y="132" width="76" height="24" rx="12" fill="#F6BD60" fill-opacity=".13"/><text x="132" y="148" text-anchor="middle" fill="#F6BD60" font-family="ui-monospace, monospace" font-size="10">OWN</text><text x="96" y="190" fill="#FFF" font-size="27" font-weight="800">ScholarSphere</text><text x="96" y="219" fill="#AAB7C0" font-size="13">learning through play + focus</text></g>
    <g><rect x="440" y="244" width="320" height="140" rx="22" fill="#10212B" stroke="#4EA8DE" stroke-opacity=".65"/><text x="464" y="277" fill="#7CC3EA" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">PLATFORM</text><text x="464" y="320" fill="#FFF" font-size="27" font-weight="800">NodeFlow</text><text x="464" y="349" fill="#AAB7C0" font-size="13">context for people + AI agents</text></g>
    <g><rect x="808" y="112" width="320" height="140" rx="22" fill="#23191D" stroke="#F28482" stroke-opacity=".65"/><text x="832" y="145" fill="#F6A6A4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">EXPLAINABLE AI</text><text x="832" y="188" fill="#FFF" font-size="27" font-weight="800">FinSight-AI</text><text x="832" y="217" fill="#AAB7C0" font-size="13">evidence → synthesis → risk</text></g>
    <g><rect x="128" y="402" width="336" height="140" rx="22" fill="#10202A" stroke="#4EA8DE" stroke-opacity=".55"/><text x="152" y="435" fill="#7CC3EA" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">COMPUTER VISION</text><text x="152" y="478" fill="#FFF" font-size="27" font-weight="800">Semicon</text><text x="152" y="507" fill="#AAB7C0" font-size="13">2× inspection-image restoration</text></g>
    <g><rect x="736" y="402" width="336" height="140" rx="22" fill="#10241F" stroke="#84DCC6" stroke-opacity=".6"/><text x="760" y="435" fill="#84DCC6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">CLINICAL INTELLIGENCE</text><text x="760" y="478" fill="#FFF" font-size="27" font-weight="800">MediInsight</text><text x="760" y="507" fill="#AAB7C0" font-size="13">consent-gated cited patient view</text></g>
    <text x="54" y="604" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">EACH LANE OPENS INTO THE SYSTEM, THE BOUNDARY, AND MY VERIFIED ROLE ↓</text></g>
  <circle cx="112" cy="182" r="6" fill="#F28482"><animate attributeName="cx" values="112;392;508;692;808;1088" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="182;182;304;304;182;182" dur="6s" repeatCount="indefinite"/></circle><rect x="1" y="1" width="1198" height="648" rx="27" stroke="#284653" stroke-width="2"/>
