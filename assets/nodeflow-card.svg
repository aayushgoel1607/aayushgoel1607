<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NodeFlow project card</title><desc id="desc">Animated diagram of shared project intelligence connecting teams, agents, context and git.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330"><stop stop-color="#071620"/><stop offset=".5" stop-color="#071019"/><stop offset="1" stop-color="#11142A"/></linearGradient><linearGradient id="a" x1="100" y1="50" x2="1100" y2="280"><stop stop-color="#84DCC6"/><stop offset="1" stop-color="#F6BD60"/></linearGradient><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#FFF" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="330" rx="24" fill="url(#bg)"/><rect width="1200" height="330" rx="24" fill="url(#g)"/><g stroke="url(#a)" stroke-width="2" fill="none" stroke-dasharray="8 11"><path d="M300 165H475"><animate attributeName="stroke-dashoffset" values="38;0" dur="2s" repeatCount="indefinite"/></path><path d="M725 165H900"><animate attributeName="stroke-dashoffset" values="0;38" dur="2s" repeatCount="indefinite"/></path><path d="M600 112V82M600 218V248"><animate attributeName="stroke-dashoffset" values="30;0" dur="1.6s" repeatCount="indefinite"/></path></g><g font-family="Inter, ui-sans-serif, system-ui" text-anchor="middle"><text x="50" y="52" text-anchor="start" fill="#FFF" font-size="30" font-weight="800">NODEFLOW</text><text x="50" y="78" text-anchor="start" fill="#A8E6D5" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">SHARED PROJECT INTELLIGENCE</text><text x="1150" y="52" text-anchor="end" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">TEAM PROJECT / PLATFORM CONTRIBUTOR</text><rect x="475" y="112" width="250" height="106" rx="22" fill="#101A2A" stroke="url(#a)" stroke-width="2.5"/><text x="600" y="157" fill="#FFF" font-size="24" font-weight="750">PROJECT BRAIN</text><text x="600" y="184" fill="#94A3B8" font-size="12">context · decisions · impact</text><g><rect x="110" y="125" width="190" height="80" rx="16" fill="#08212A" stroke="#84DCC6" stroke-opacity=".55"/><text x="205" y="157" fill="#A8E6D5" font-size="11" letter-spacing="2">PEOPLE</text><text x="205" y="182" fill="#FFF" font-size="18" font-weight="700">TEAMS</text></g><g><rect x="900" y="125" width="190" height="80" rx="16" fill="#17142A" stroke="#F6BD60" stroke-opacity=".55"/><text x="995" y="157" fill="#F9D7A0" font-size="11" letter-spacing="2">TOOLS</text><text x="995" y="182" fill="#FFF" font-size="18" font-weight="700">AI AGENTS</text></g><g><rect x="505" y="26" width="190" height="56" rx="15" fill="#0D1A28" stroke="#38BDF8" stroke-opacity=".45"/><text x="600" y="60" fill="#FFF" font-size="15" font-weight="700">GIT / CHANGES</text></g><g><rect x="505" y="248" width="190" height="56" rx="15" fill="#17142A" stroke="#F6BD60" stroke-opacity=".45"/><text x="600" y="282" fill="#FFF" font-size="15" font-weight="700">SECURE DATA</text></g></g><rect x="1" y="1" width="1198" height="328" rx="23" stroke="url(#a)" stroke-opacity=".32" stroke-width="2"/>
