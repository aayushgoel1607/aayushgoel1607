<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MediInsight clinical intelligence</title><desc id="desc">Animated consent-gated clinical data flow from hospital sources to a cited doctor workspace.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330"><stop stop-color="#072019"/><stop offset=".5" stop-color="#0B1020"/><stop offset="1" stop-color="#071A24"/></linearGradient><linearGradient id="a" x1="70" y1="60" x2="1130" y2="270"><stop stop-color="#34D399"/><stop offset=".55" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#FFF" stroke-opacity=".035"/></pattern></defs><rect width="1200" height="330" rx="24" fill="url(#bg)"/><rect width="1200" height="330" rx="24" fill="url(#g)"/><g font-family="Inter, ui-sans-serif, system-ui"><text x="50" y="52" fill="#FFF" font-size="30" font-weight="800">MEDIINSIGHT</text><text x="50" y="78" fill="#6EE7B7" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">LONGITUDINAL CLINICAL INTELLIGENCE</text><text x="1150" y="52" text-anchor="end" fill="#64748B" font-family="ui-monospace, monospace" font-size="11">PROTOTYPE / ANONYMIZED DEMO DATA</text></g><g stroke="url(#a)" fill="none" stroke-width="2" stroke-dasharray="8 11"><path d="M268 165H414"><animate attributeName="stroke-dashoffset" values="38;0" dur="1.8s" repeatCount="indefinite"/></path><path d="M620 165H766"><animate attributeName="stroke-dashoffset" values="38;0" dur="1.8s" repeatCount="indefinite"/></path><path d="M972 165H1050"><animate attributeName="stroke-dashoffset" values="38;0" dur="1.8s" repeatCount="indefinite"/></path></g><g font-family="Inter, ui-sans-serif, system-ui" text-anchor="middle"><g><rect x="60" y="112" width="208" height="106" rx="18" fill="#0A211E" stroke="#34D399" stroke-opacity=".6"/><text x="164" y="146" fill="#6EE7B7" font-size="11" letter-spacing="2">HOSPITAL DATA</text><text x="164" y="179" fill="#FFF" font-size="20" font-weight="750">EHR / FHIR</text><text x="164" y="201" fill="#94A3B8" font-size="11">approved source systems</text></g><g><rect x="414" y="112" width="206" height="106" rx="18" fill="#0B2028" stroke="#22D3EE" stroke-opacity=".6"/><text x="517" y="146" fill="#67E8F9" font-size="11" letter-spacing="2">GOVERN</text><text x="517" y="179" fill="#FFF" font-size="20" font-weight="750">CONSENT GATE</text><text x="517" y="201" fill="#94A3B8" font-size="11">match · ingest · audit</text></g><g><rect x="766" y="112" width="206" height="106" rx="18" fill="#11192A" stroke="#818CF8" stroke-opacity=".6"/><text x="869" y="146" fill="#A5B4FC" font-size="11" letter-spacing="2">UNDERSTAND</text><text x="869" y="179" fill="#FFF" font-size="20" font-weight="750">CITED VIEW</text><text x="869" y="201" fill="#94A3B8" font-size="11">timeline · labs · meds</text></g><g><rect x="1050" y="112" width="100" height="106" rx="18" fill="#15142A" stroke="#A78BFA" stroke-opacity=".6"/><text x="1100" y="148" fill="#C4B5FD" font-size="10">HUMAN</text><text x="1100" y="176" fill="#FFF" font-size="16" font-weight="750">REVIEW</text><text x="1100" y="199" fill="#94A3B8" font-size="9">clinician</text></g><text x="600" y="282" fill="#64748B" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">TIMELINE · ALLERGY SAFETY · MEDICATIONS · LABS · SOURCES · CLINICAL SUMMARY</text></g><circle cx="268" cy="165" r="5" fill="#34D399"><animate attributeName="cx" values="268;414;620;766;972;1050" dur="4s" repeatCount="indefinite"/></circle><rect x="1" y="1" width="1198" height="328" rx="23" stroke="url(#a)" stroke-opacity=".32" stroke-width="2"/>
</svg>
