  <g font-family="Inter, ui-sans-serif, system-ui"><text x="54" y="58" fill="#F6BD60" font-family="ui-monospace, monospace" font-size="13" letter-spacing="3">THE BUILD LOOP</text><text x="1146" y="58" text-anchor="end" fill="#81919D" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">AAYUSH / PRODUCT ENGINEERING</text><text x="600" y="128" text-anchor="middle" fill="#F6BD60" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">CURRENT MODE</text><text x="600" y="165" text-anchor="middle" fill="#F7FAFC" font-size="29" font-weight="800">MAKE COMPLEX THINGS FEEL CLEAR</text>
    <g><rect x="72" y="220" width="206" height="112" rx="20" fill="#16202A" stroke="#F28482" stroke-opacity=".5"/><text x="98" y="254" fill="#F6A6A4" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">01 / QUESTION</text><text x="98" y="288" fill="#FFF" font-size="20" font-weight="700">Find the real need</text><text x="98" y="311" fill="#9CADB8" font-size="12">people · evidence · limits</text></g>
    <g><rect x="338" y="220" width="206" height="112" rx="20" fill="#18221F" stroke="#F6BD60" stroke-opacity=".5"/><text x="364" y="254" fill="#F6BD60" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">02 / MODEL</text><text x="364" y="288" fill="#FFF" font-size="20" font-weight="700">Shape the system</text><text x="364" y="311" fill="#9CADB8" font-size="12">flows · contracts · data</text></g>
    <g><rect x="604" y="220" width="206" height="112" rx="20" fill="#10212B" stroke="#4EA8DE" stroke-opacity=".55"/><text x="630" y="254" fill="#7CC3EA" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">03 / BUILD</text><text x="630" y="288" fill="#FFF" font-size="20" font-weight="700">Engineer the depth</text><text x="630" y="311" fill="#9CADB8" font-size="12">security · tests · failure</text></g>
    <g><rect x="870" y="220" width="258" height="112" rx="20" fill="#10241F" stroke="#84DCC6" stroke-opacity=".55"/><text x="896" y="254" fill="#84DCC6" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">04 / SHIP + LEARN</text><text x="896" y="288" fill="#FFF" font-size="20" font-weight="700">Make it useful</text><text x="896" y="311" fill="#9CADB8" font-size="12">experience · feedback · iteration</text></g>
    <text x="72" y="430" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">LEARNING PRODUCTS</text><text x="294" y="430" fill="#F6BD60" font-size="16">•</text><text x="330" y="430" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">AGENT PLATFORMS</text><text x="550" y="430" fill="#4EA8DE" font-size="16">•</text><text x="586" y="430" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">EXPLAINABLE AI</text><text x="790" y="430" fill="#84DCC6" font-size="16">•</text><text x="826" y="430" fill="#81919D" font-family="ui-monospace, monospace" font-size="11" letter-spacing="2">THOUGHTFUL UX</text></g>
