<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aayush's GitHub build signal</title><desc id="desc">A self-contained animated panel showing a ship, test, learn and iterate development rhythm.</desc>
  <defs>
    <linearGradient id="a" x1="90" y1="0" x2="1110" y2="0"><stop stop-color="#F472B6"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1200" y2="250"><stop stop-color="#15102A"/><stop offset=".5" stop-color="#0B1020"/><stop offset="1" stop-color="#06202A"/></linearGradient>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#FFF" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="250" rx="22" fill="url(#b)"/><rect width="1200" height="250" rx="22" fill="url(#g)"/>
  <g font-family="Inter, ui-sans-serif, system-ui">
    <text x="50" y="53" fill="#FFF" font-size="24" font-weight="750">BUILD SIGNAL</text>
    <text x="50" y="78" fill="#94A3B8" font-size="12" letter-spacing="2">HOW I LIKE TO MOVE SOFTWARE FORWARD</text>
    <text x="1150" y="53" text-anchor="end" fill="#34D399" font-family="ui-monospace, monospace" font-size="12">● ACTIVE</text>
    <path d="M155 150H1045" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
    <path d="M155 150H1045" stroke="url(#a)" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 16"><animate attributeName="stroke-dashoffset" values="56;0" dur="2.4s" repeatCount="indefinite"/></path>
    <g text-anchor="middle">
      <g><circle cx="155" cy="150" r="31" fill="#17132B" stroke="#F472B6" stroke-width="2"/><text x="155" y="155" fill="#FFF" font-size="14" font-weight="700">IDEA</text><text x="155" y="209" fill="#94A3B8" font-size="11" letter-spacing="1">ASK WHY</text></g>
      <g><circle cx="380" cy="150" r="31" fill="#16142C" stroke="#C084FC" stroke-width="2"/><text x="380" y="155" fill="#FFF" font-size="14" font-weight="700">BUILD</text><text x="380" y="209" fill="#94A3B8" font-size="11" letter-spacing="1">MAKE IT REAL</text></g>
      <g><circle cx="600" cy="150" r="31" fill="#12172C" stroke="#A78BFA" stroke-width="2"/><text x="600" y="155" fill="#FFF" font-size="14" font-weight="700">TEST</text><text x="600" y="209" fill="#94A3B8" font-size="11" letter-spacing="1">FIND THE EDGE</text></g>
      <g><circle cx="820" cy="150" r="31" fill="#0C1B2B" stroke="#38BDF8" stroke-width="2"/><text x="820" y="155" fill="#FFF" font-size="14" font-weight="700">SHIP</text><text x="820" y="209" fill="#94A3B8" font-size="11" letter-spacing="1">CREATE VALUE</text></g>
      <g><circle cx="1045" cy="150" r="31" fill="#08212A" stroke="#22D3EE" stroke-width="2"/><text x="1045" y="155" fill="#FFF" font-size="13" font-weight="700">LEARN</text><text x="1045" y="209" fill="#94A3B8" font-size="11" letter-spacing="1">LOOP AGAIN</text></g>
    </g>
    <circle cx="155" cy="150" r="7" fill="#FFF"><animate attributeName="cx" values="155;380;600;820;1045;155" dur="7s" repeatCount="indefinite"/><animate attributeName="fill" values="#F472B6;#C084FC;#A78BFA;#38BDF8;#22D3EE;#F472B6" dur="7s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="1198" height="248" rx="21" stroke="url(#a)" stroke-opacity=".3" stroke-width="2"/>
</svg>
